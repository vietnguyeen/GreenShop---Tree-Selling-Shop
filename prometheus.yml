global:
  scrape_interval: 15s # How often to grab metrics

scrape_configs:
  - job_name: 'django-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['web:8000'] # Points to your Django container

  - job_name: 'vps-host'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']