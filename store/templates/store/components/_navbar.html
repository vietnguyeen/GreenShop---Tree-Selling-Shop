<style>
  #mainNav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    height: 68px;
    background: rgba(14,31,21,0.97);
    backdrop-filter: blur(16px) saturate(180%);
    border-bottom: 1px solid rgba(200,168,75,0.15);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5vw;
    transition: height var(--transition), background var(--transition);
  }
  #mainNav.nav-scrolled {
    height: 60px;
    background: rgba(14,31,21,0.995);
    border-bottom-color: rgba(200,168,75,0.25);
  }

  /* Logo */
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem; font-weight: 700;
    color: var(--cream); text-decoration: none;
    display: flex; align-items: center; gap: 9px;
    flex-shrink: 0;
  }
  .nav-logo-leaf {
    width: 30px; height: 30px;
    border-radius: 50% 10px 50% 10px;
    background: linear-gradient(135deg, var(--moss), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
  }

  /* --- CẤU HÌNH MENU CHO BẢN WEB (MÁY TÍNH) --- */
  .nav-links {
    display: flex; align-items: center; gap: 0.25rem; list-style: none;
    flex: 1; justify-content: flex-end; 
  }
  .nav-links a.main-link {
    color: rgba(245,237,224,0.72); text-decoration: none;
    font-size: 0.875rem; font-weight: 500;
    padding: 7px 13px; border-radius: 8px;
    transition: color var(--transition), background var(--transition);
    display: block;
  }
  .nav-links a.main-link:hover,
  .nav-links a.main-link.active { color: var(--cream); background: rgba(255,255,255,0.08); }
  
  /* Cấu hình Dropdown Kho Cây trên Web */
  .nav-dropdown {
    position: relative; 
  }
  .dropdown-menu {
    position: absolute; top: 100%; left: 0; 
    background: rgba(14,31,21,0.95);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 8px; padding: 8px;
    min-width: 180px;
    display: none; /* Ẩn đi theo mặc định */
    flex-direction: column; gap: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    list-style: none;
  }
  .nav-dropdown:hover .dropdown-menu {
    display: flex; /* Hiện ra khi rê chuột (hover) vào Kho Cây */
  }
  .dropdown-menu a {
    color: rgba(245,237,224,0.72); text-decoration: none;
    padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; display: block;
    transition: background 0.3s;
  }
  .dropdown-menu a:hover { background: rgba(255,255,255,0.1); color: var(--cream); }

  /* Đẩy riêng nút Giỏ hàng cách xa */
  .nav-links li:last-child { margin-left: 2.5rem; }

  /* Cart button */
  .nav-cart-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--amber); color: var(--white) !important;
    padding: 8px 18px; border-radius: 50px;
    font-size: 0.83rem; font-weight: 600; text-decoration: none;
    transition: background var(--transition), transform var(--transition);
  }
  .nav-cart-btn:hover { background: var(--ember) !important; transform: translateY(-1px); }
  .nav-cart-count {
    background: var(--white); color: var(--ember);
    border-radius: 50%; width: 18px; height: 18px; min-width: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 800;
  }

  /* Hamburger */
  .nav-hamburger {
    display: none; flex-direction: column; gap: 5px;
    background: none; border: none; cursor: pointer; padding: 4px;
    margin-left: 1.5rem;
  }
  .nav-hamburger span {
    display: block; width: 24px; height: 2px;
    background: var(--cream); border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
  }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* --- CẤU HÌNH MENU CHO BẢN MOBILE (ĐIỆN THOẠI) --- */
  @media (max-width: 860px) {
    .nav-links {
      display: none; flex-direction: column; align-items: flex-start;
      position: fixed; top: 68px; left: 0; right: 0;
      background: rgba(14,31,21,0.98); backdrop-filter: blur(12px);
      padding: 1.5rem 5vw 2.5rem; border-bottom: 1px solid rgba(200,168,75,0.15);
      gap: 0; z-index: 999;
    }
    .nav-links.is-open { display: flex; }
    
    /* Trang chủ, Kho cây, Dịch vụ nằm bên trái */
    .nav-links li { width: 100%; }
    .nav-links a.main-link { 
      padding: 14px 10px; margin-bottom: 6px; font-size: 1.1rem; width: 100%; 
    }
    
    /* Phá vỡ Dropdown, chuyển thành các mục con nằm bên phải */
    .nav-dropdown:hover .dropdown-menu { display: flex; } /* Vẫn hiển thị */
    .dropdown-menu {
      display: flex; position: static; /* Gắn liền vào menu chính */
      background: transparent; border: none; padding: 0; box-shadow: none;
      align-items: flex-end; /* Đẩy toàn bộ 4 nút cây sang sát lề phải */
      margin-bottom: 10px;
    }
    .dropdown-menu a {
      font-size: 1rem; padding: 10px 15px; 
      color: rgba(200,168,75,0.9); /* Màu hơi vàng cho dễ nhận biết */
      border-right: 3px solid var(--amber); /* Nhấn nhá 1 đường viền nhỏ bên phải */
      border-radius: 0;
      text-align: right; width: auto;
    }

    .nav-links li:last-child {
      margin-left: 0; margin-top: 1.5rem; 
    }
    .nav-cart-btn {
      width: fit-content; padding: 12px 24px; font-size: 1rem;
    }
    .nav-hamburger { display: flex; }
  }
</style>

<nav id="mainNav">
  <a class="nav-logo" href="{% url 'home' %}">
    <span class="nav-logo-leaf">🌿</span>
    Hoa Kiểng Hoàng Nam
  </a>

  <ul class="nav-links" id="navLinks">
    <li><a href="{% url 'home' %}" class="main-link">Trang Chủ</a></li>
    
    <li class="nav-dropdown">
      <a href="{% url 'kho_cay' %}" class="main-link">Kho Cây ▾</a>
      
      <ul class="dropdown-menu">
        <li><a href="{% url 'kho_cay' %}?q=Cây Bonsai">Cây Bonsai</a></li>
        <li><a href="{% url 'kho_cay' %}?q=Cây Kiểng">Cây Kiểng</a></li>
        <li><a href="{% url 'kho_cay' %}?q=Cây Ăn Quả">Cây Ăn Quả</a></li>
        <li><a href="{% url 'kho_cay' %}?q=Hoa">Hoa</a></li>
      </ul>
    </li>

    <li><a href="{% url 'home' %}#contact" class="main-link">Dịch Vụ</a></li>

    <li>
      <a class="nav-cart-btn" href="{% url 'cart_detail' %}">
        🛒
        {% if cart_item_count and cart_item_count > 0 %}
          <span class="nav-cart-count">{{ cart_item_count }}</span>
        {% endif %}
        Giỏ Hàng
      </a>
    </li>
  </ul>

  <button class="nav-hamburger" id="navHamburger" aria-label="Mở menu" onclick="toggleMobileNav()">
    <span></span><span></span><span></span>
  </button>
</nav>

<script>
  function toggleMobileNav() {
    document.getElementById('navLinks').classList.toggle('is-open');
    document.getElementById('navHamburger').classList.toggle('open');
  }
</script>
