<style>
  #quickViewModal {
    display: none; position: fixed; inset: 0; z-index: 4000;
    background: rgba(14,31,21,0.78); backdrop-filter: blur(7px);
    align-items: center; justify-content: center; padding: 1.5rem;
  }
  #quickViewModal.is-open { display: flex; }

  .qv-card {
    background: var(--white); border-radius: var(--radius-xl);
    max-width: 820px; width: 100%; max-height: 90vh;
    display: flex; overflow: hidden; position: relative;
    box-shadow: 0 36px 90px rgba(0,0,0,0.38);
    animation: qvIn 0.32s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes qvIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Ảnh */
  .qv-image-panel {
    flex: 1.1; background: linear-gradient(135deg, var(--mist), #c5e0cc);
    min-height: 360px; overflow: hidden; position: relative; flex-shrink: 0;
  }
  .qv-image-panel img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.4s ease;
  }
  .qv-image-panel:hover img { transform: scale(1.04); }
  .qv-image-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center; font-size: 6rem;
  }

  /* Ribbon */
  .qv-ribbon {
    position: absolute; top: 1rem; left: 1rem;
    background: var(--forest); color: var(--gold);
    font-size: 0.7rem; font-weight: 700;
    padding: 4px 12px; border-radius: 50px; letter-spacing: 0.05em;
  }
  .qv-ribbon.out  { background: var(--danger); color: #fff; }
  .qv-ribbon.low  { background: var(--amber);  color: #fff; }

  /* Info panel */
  .qv-info-panel {
    flex: 1; padding: 2.8rem 2.4rem;
    display: flex; flex-direction: column; justify-content: center;
    overflow-y: auto;
  }
  .qv-category {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--moss); margin-bottom: 0.5rem;
  }
  .qv-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.95rem; font-weight: 700; color: var(--forest);
    line-height: 1.2; margin-bottom: 0.5rem;
  }
  .qv-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.55rem; font-weight: 700; color: var(--amber);
    margin-bottom: 1.6rem;
  }
  .qv-specs {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0.75rem; background: var(--cream);
    border-radius: var(--radius-md); padding: 1.2rem; margin-bottom: 1.4rem;
  }
  .qv-spec-label {
    font-size: 0.67rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); margin-bottom: 3px;
  }
  .qv-spec-value { font-size: 0.95rem; font-weight: 600; color: var(--jungle); }

  /* Stock row */
  .qv-stock-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.82rem; color: var(--muted); margin-bottom: 1.4rem;
  }
  .qv-stock-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--moss); flex-shrink: 0;
  }
  .qv-stock-dot.low   { background: var(--amber); }
  .qv-stock-dot.empty { background: var(--danger); }

  /* CTA */
  .qv-add-btn {
    width: 100%; padding: 14px; border-radius: var(--radius-md);
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
    border: none; cursor: pointer; text-decoration: none; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: background var(--transition), transform var(--transition);
  }
  .qv-add-btn.available { background: var(--forest); color: var(--white); }
  .qv-add-btn.available:hover { background: var(--jungle); transform: translateY(-1px); }
  .qv-add-btn.sold-out  { background: #d0d0d0; color: #888; cursor: not-allowed; }

  /* Close */
  .qv-close {
    position: absolute; top: 1rem; right: 1rem; z-index: 10;
    background: rgba(14,31,21,0.1); border: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; color: var(--ink);
    transition: background var(--transition);
  }
  .qv-close:hover { background: rgba(14,31,21,0.2); }

  @media (max-width: 680px) {
    .qv-card { flex-direction: column; max-height: 92vh; overflow-y: auto; }
    .qv-image-panel { min-height: 200px; max-height: 220px; flex: none; }
    .qv-info-panel  { padding: 1.8rem 1.4rem; }
    .qv-name        { font-size: 1.5rem; }
  }
</style>

<div id="quickViewModal" role="dialog" aria-modal="true">
  <div class="qv-card">
    <button class="qv-close" onclick="closeQuickView()" aria-label="Đóng">✕</button>

    <!-- Ảnh -->
    <div class="qv-image-panel">
      <div id="qvRibbon" class="qv-ribbon" style="display:none"></div>
      <div id="qvImageWrap">
        <div class="qv-image-placeholder">🌳</div>
      </div>
    </div>

    <!-- Thông tin -->
    <div class="qv-info-panel">
      <div class="qv-category" id="qvCategory">Cây Giống</div>
      <div class="qv-name"     id="qvName">—</div>
      <div class="qv-price"    id="qvPrice">—</div>

      <div class="qv-specs">
        <div>
          <div class="qv-spec-label">Hoành gốc</div>
          <div class="qv-spec-value" id="qvGirth">—</div>
        </div>
        <div>
          <div class="qv-spec-label">Chiều cao</div>
          <div class="qv-spec-value" id="qvHeight">—</div>
        </div>
        <div>
          <div class="qv-spec-label">Đường kính</div>
          <div class="qv-spec-value" id="qvDiameter">—</div>
        </div>
        <div>
          <div class="qv-spec-label">Tồn kho</div>
          <div class="qv-spec-value" id="qvStockNum">—</div>
        </div>
      </div>

      <div class="qv-stock-row">
        <span class="qv-stock-dot" id="qvStockDot"></span>
        <span id="qvStockText">—</span>
      </div>

      <!--
        Yêu cầu #2: Không còn kiểm tra session phone.
        Nút luôn là thẻ <a> trỏ thẳng tới add_to_cart nếu còn hàng.
      -->
      <a id="qvCartBtn" href="#" class="qv-add-btn available">
        🛒 Thêm Vào Giỏ Hàng
      </a>
    </div>
  </div>
</div>

<script>
  /**
   * openQuickView – được gọi từ product card.
   * Tham số truyền vào từ data attributes của template.
   */
  function openQuickView(id, name, imageUrl, girth, height, diameter, price, stock, category) {
    var stockNum = parseInt(stock, 10) || 0;

    /* Điền thông tin */
    document.getElementById('qvCategory').textContent = category || 'Cây Giống';
    document.getElementById('qvName').textContent     = name     || '—';
    document.getElementById('qvPrice').textContent    = price    || '—';
    document.getElementById('qvGirth').textContent    = girth    || 'N/A';
    document.getElementById('qvHeight').textContent   = height   || 'N/A';
    document.getElementById('qvDiameter').textContent = diameter || 'N/A';
    document.getElementById('qvStockNum').textContent = stockNum;

    /* Ảnh */
    var wrap = document.getElementById('qvImageWrap');
    if (imageUrl) {
      wrap.innerHTML = '<img src="' + imageUrl + '" alt="' + name + '" loading="lazy">';
    } else {
      wrap.innerHTML = '<div class="qv-image-placeholder">🌳</div>';
    }

    /* Ribbon & stock indicator */
    var ribbon   = document.getElementById('qvRibbon');
    var dot      = document.getElementById('qvStockDot');
    var stockTxt = document.getElementById('qvStockText');

    if (stockNum <= 0) {
      ribbon.textContent = 'Đã Hết Hàng';
      ribbon.className   = 'qv-ribbon out';
      ribbon.style.display = 'block';
      dot.className      = 'qv-stock-dot empty';
      stockTxt.textContent = 'Sản phẩm tạm hết hàng';
    } else if (stockNum <= 3) {
      ribbon.textContent = 'Sắp Hết – Còn ' + stockNum;
      ribbon.className   = 'qv-ribbon low';
      ribbon.style.display = 'block';
      dot.className      = 'qv-stock-dot low';
      stockTxt.textContent = '⚡ Sắp hết – còn ' + stockNum + ' cây trong kho';
    } else {
      ribbon.textContent = 'Còn Hàng';
      ribbon.className   = 'qv-ribbon';
      ribbon.style.display = 'block';
      dot.className      = 'qv-stock-dot';
      stockTxt.textContent = 'Còn ' + stockNum + ' cây trong kho';
    }

    /* Nút thêm giỏ
       Yêu cầu #2: Không còn check session phone.
       Chỉ phân biệt còn hàng / hết hàng. */
    var cartBtn = document.getElementById('qvCartBtn');
    if (stockNum <= 0) {
      cartBtn.className   = 'qv-add-btn sold-out';
      cartBtn.textContent = '🚫 Đã Hết Hàng';
      cartBtn.removeAttribute('href');
      cartBtn.onclick = function (e) { e.preventDefault(); };
    } else {
      cartBtn.className = 'qv-add-btn available';
      cartBtn.innerHTML = '🛒 Thêm Vào Giỏ Hàng';
      cartBtn.href      = '/them-vao-gio/' + id + '/';
      cartBtn.onclick   = null;
    }

    /* Mở modal */
    document.getElementById('quickViewModal').classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function closeQuickView() {
    document.getElementById('quickViewModal').classList.remove('is-open');
    document.body.style.overflow = '';
  }

  /* Đóng khi click backdrop */
  document.getElementById('quickViewModal').addEventListener('click', function (e) {
    if (e.target === this) closeQuickView();
  });

  /* Đóng bằng Escape */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeQuickView();
  });
</script>
