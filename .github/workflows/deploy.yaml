name: Tự động Deploy lên VPS

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kết nối SSH và Cập nhật code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/GreenShop---Tree-Selling-Shop
            
            git pull origin main
            
            # 1. Tắt các container hiện tại
            docker-compose down --remove-orphans
            
            # 2. FIX: Dùng lệnh ép buộc tiêu diệt container web bị kẹt (nếu có)
            docker rm -f greenshop---tree-selling-shop_web_1 || true
            
            # 3. Build và khởi động lại container mới tinh
            docker-compose up -d --build
            
            # 4. Migrate Database
            docker-compose exec -T web python manage.py migrate
            
            # 5. Gom Static files
            docker-compose exec -T web python manage.py collectstatic --noinput