name: Tự động Deploy lên VPS

# Kịch bản này sẽ chạy mỗi khi bạn push code lên nhánh "main"
on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kết nối SSH và Cập nhật code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/GreenShop---Tree-Selling-Shop
            
            # 1. Kéo code mới nhất từ GitHub về VPS
            git pull origin main
            
            # 2. Build và khởi động lại các container (Dùng cú pháp docker compose mới)
            docker compose up -d --build
            
            # 3. Tự động chạy Migrate Database (Cập nhật DB nếu có sửa Models)
            docker compose exec -T web python manage.py migrate
            
            # 4. Tự động gom CSS/JS và ảnh tĩnh (icon Zalo...)
            docker compose exec -T web python manage.py collectstatic --noinput