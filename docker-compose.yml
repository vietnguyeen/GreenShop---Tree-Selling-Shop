services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=greenshop_db
      - POSTGRES_USER=vietng
      - POSTGRES_PASSWORD=130804
    ports:
      - "5432:5432"

  web:
    build: .
    command: gunicorn plant_shop.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - django_media:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  prometheus:
    image: prom/prometheus:latest
    container_name: greenshop_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - greenshop_network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: greenshop_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - greenshop_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: always

  celery_worker:
    build: .
    command: celery -A plant_shop worker --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    env_file:
      - .env

# KHAI BÁO Ổ CỨNG VÀ MẠNG LUÔN ĐẶT Ở DƯỚI CÙNG
volumes:
  postgres_data:
  django_media:
  caddy_data:     # Ổ cứng lưu chứng chỉ HTTPS
  caddy_config:
  prometheus_data:

networks:
  greenshop_network: